name: Public release checks
on: [push, pull_request]
jobs:
  synthetic-tests-and-history-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: dependencies/project-python312-20261003-v2.lock.txt
      - run: python3 -m pip install -r dependencies/project-python312-20261003-v2.lock.txt -r requirements-dev.txt
      - uses: posit-dev/setup-air@v1
        with:
          version: '0.12.0'
      - run: ruff format --check .
      - run: ruff check .
      - run: air format --check .
      - run: python3 scripts/verify_repository_structure.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 run.py demo
      - run: python3 scripts/verify_public_release.py
      - run: python3 scripts/verify_public_history.py
